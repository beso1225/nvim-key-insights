[package]
name = "key-insights"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }
unicode-general-category = "1"

[lib]
name = "key_insights"
path = "src/lib.rs"

[[bin]]
name = "key-insights"
path = "src/main.rs"
