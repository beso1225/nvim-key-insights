[package]
name = "key-insights"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-general-category = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "key_insights"
path = "src/lib.rs"

[[bin]]
name = "key-insights"
path = "src/main.rs"
