name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neovim-compatibility:
    name: Neovim 0.10 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Neovim 0.10.4
        env:
          NEOVIM_SHA256: 95aaa8e89473f5421114f2787c13ae0ec6e11ebbd1a13a1bd6fcf63420f8073f
          NEOVIM_URL: https://github.com/neovim/neovim/releases/download/v0.10.4/nvim-linux-x86_64.tar.gz
        run: |
          archive="$RUNNER_TEMP/nvim-linux-x86_64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 "$NEOVIM_URL" --output "$archive"
          echo "$NEOVIM_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"

      - name: Run Lua tests on the supported lower bound
        run: |
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless -u tests/lua/minimal_init.lua -l tests/lua/run.lua

  check:
    name: Project checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Validate Nix flake
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Run project checks
        run: nix develop --no-update-lock-file --command pkf run check

  native-platforms:
    name: Native checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Verify native Nix system
        run: |
          actual_system=$(nix eval --raw --impure --expr builtins.currentSystem)
          test "$actual_system" = "${{ matrix.system }}"

      - name: Validate Nix flake
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Run uncached project checks
        run: nix develop --no-update-lock-file --command pkf run --no-cache check
